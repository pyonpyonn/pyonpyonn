<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PYONPYONN cyberpunk developer banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.5" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#090311"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff00d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f7ff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>

  <path d="M0 250 L220 185 L420 260 L650 175 L850 235 L1200 125 L1200 320 L0 320 Z" fill="#00f7ff" fill-opacity="0.035"/>
  <path d="M0 275 L260 205 L455 286 L690 200 L880 258 L1200 150" fill="none" stroke="#ff00d4" stroke-opacity="0.22" stroke-width="2"/>

  <g opacity="0.9">
    <circle cx="93" cy="73" r="3" fill="#00f7ff" filter="url(#glow)"/>
    <circle cx="1102" cy="92" r="3" fill="#ff00d4" filter="url(#glow)"/>
    <circle cx="1045" cy="245" r="2" fill="#8b5cf6" filter="url(#glow)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="78" y="88" fill="#7df9ff" font-size="18" letter-spacing="4">SYSTEM://DEVELOPER_PROFILE</text>
    <text x="78" y="177" fill="url(#neon)" font-size="78" font-weight="800" letter-spacing="8" filter="url(#glow)">PYONPYONN</text>
    <text x="82" y="221" fill="#c8d7ff" font-size="20" letter-spacing="2">FULL-STACK  //  AI + ML  //  CREATIVE DEVELOPMENT</text>
    <text x="82" y="263" fill="#00f7ff" font-size="16">&gt; BUILDING FUTURE-FACING WEB + DATA EXPERIENCES_</text>
  </g>

  <g transform="translate(1000 188)" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.9" filter="url(#glow)">
    <path d="M0 38 L38 0 L76 38 L38 76 Z"/>
    <path d="M28 38 L38 28 L48 38 L38 48 Z"/>
    <path d="M88 38 L126 0 L164 38 L126 76 Z" opacity="0.55"/>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="url(#neon)" stroke-opacity="0.38" stroke-width="2"/>
</svg>
