<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="animated neon divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7ff" stop-opacity="0"/>
      <stop offset="0.20" stop-color="#00f7ff" stop-opacity="0.38"/>
      <stop offset="0.50" stop-color="#8b5cf6" stop-opacity="0.72"/>
      <stop offset="0.80" stop-color="#ff00d4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff00d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <rect x="55" y="11" width="1090" height="1" rx="1" fill="url(#line)"/>
  <rect x="55" y="10" width="80" height="3" rx="2" fill="url(#sweep)" filter="url(#softGlow)">
    <animate attributeName="x" values="55;1065;55" dur="5.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </rect>
  <circle cx="55" cy="11.5" r="2" fill="#00f7ff">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1145" cy="11.5" r="2" fill="#ff00d4">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>